<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTC Medicine Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Find håndkøbsmedicin</h1>
    <p>Søg på tværs af apoteker i netværket</p>

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="Søg fx Panodil eller Ipren"
      />
      <button id="searchBtn">Søg</button>
    </div>

    <section id="results"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
