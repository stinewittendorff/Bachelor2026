<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAP · Find håndkøbsmedicin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="page-header">
      <p class="eyebrow">BAP Client</p>
      <h1>Find håndkøbsmedicin</h1>
      <p class="subtitle">Søg på tværs af apoteker i netværket</p>
    </header>

    <section class="panel">
      <div class="panel-header">
        <div>
          <h2>BAP · Brugergrænseflade</h2>
          <p>Buyer-side indgang til Beckn-netværket</p>
        </div>
        <span class="role-badge">Buyer side</span>
      </div>

      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="Søg fx Panodil eller Ipren"
        />
        <button id="searchBtn">Søg</button>
      </div>

      <section id="results" class="results-list"></section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
